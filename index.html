<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajío Récords | Sitio Oficial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn {
            display: block;
            width: 100%;
            background: #181818;
            color: #fff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-align: center;
        }
        .btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        /* Menú Desplegable */
        .dropdown-content {
            display: none;
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 14px;
            text-align: left;
        }
        .artist-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            color: #ccc;
            text-decoration: none;
            border-bottom: 1px solid #222;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .artist-link:last-child { border-bottom: none; }
        .artist-link:hover { color: #1DB954; }
        .artist-link span { font-size: 0.8rem; color: #666; }
        .show { display: block; }
        .footer {
            margin-top: 35px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BAJÍO RÉCORDS</h1>
        <p class="subtitle">Sello Discográfico Independiente</p>
        
        <!-- Botón Desplegable Spotify -->
        <button onclick="toggleSpotify()" class="btn">🎧 Catálogo en Spotify ▼</button>
        
        <div id="spotifyList" class="dropdown-content">
            <a href="https://open.spotify.com/artist/1uLtlNQjKWd3GxKVDmeTzY?si=THr5XUYpT72OR7fGpKDkEA" target="_blank" class="artist-link">NUNCHO <span>Escuchar ↗</span></a>
            <a href="https://open.spotify.com/artist/702kG0xjEgJkTDZENxmAXc?si=cQ4pCKm7TkOnitlPEY6n8w" target="_blank" class="artist-link">JR Music <span>Escuchar ↗</span></a>
            <a href="https://open.spotify.com/artist/5UwKQIN4liBc1FzEo4kQ7w?si=SQ9yCTe5SWyFp6uyW855NA" target="_blank" class="artist-link">La IA Records <span>Escuchar ↗</span></a>
            <a href="https://open.spotify.com/artist/6o2wCTaBd53hIhAanS8zrE?si=W9tVXxLCQqa_rGzx3qEBLA" target="_blank" class="artist-link">La Posesión Norteña <span>Escuchar ↗</span></a>
            <a href="https://open.spotify.com/artist/23nvERBfyJniYS3nSwTMp3?si=89SbSdYZRre4tYmfjxKKEg" target="_blank" class="artist-link">Grupo Zona Regia <span>Escuchar ↗</span></a>
        </div>

        <a href="https://youtube.com" target="_blank" class="btn">▶️ Canal de YouTube</a>
        <a href="https://instagram.com" target="_blank" class="btn">📸 Instagram Oficial</a>
        <a href="mailto:contacto@bajiorecords.com" class="btn">📩 Envío de Demos / Contacto</a>

        <div class="footer">
            &copy; Bajío Récords. Todos los derechos reservados.
        </div>
    </div>

    <script>
        function toggleSpotify() {
            document.getElementById("spotifyList").classList.toggle("show");
        }
    </script>
</body>
</html>
