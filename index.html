<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajío Récords</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        p {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn {
            display: block;
            background: #181818;
            color: #fff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-weight: 600;
            border: 1px solid #2a2a2a;
            transition: 0.2s;
        }
        .btn:hover {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BAJÍO RÉCORDS</h1>
        <p>Sello Discográfico Independiente</p>
        
        <a href="https://open.spotify.com" target="_blank" class="btn">🎧 Catálogo en Spotify</a>
        <a href="https://youtube.com" target="_blank" class="btn">▶️ Canal de YouTube</a>
        <a href="https://instagram.com" target="_blank" class="btn">📸 Instagram Oficial</a>
        <a href="mailto:contacto@bajiorecords.com" class="btn">📩 Envío de Demos / Contacto</a>
    </div>
</body>
</html>
